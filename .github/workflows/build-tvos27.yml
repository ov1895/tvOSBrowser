name: Build tvOS Browser 27

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned tvOS 27 IPA
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          echo "=== tvOS SDKs ==="
          xcodebuild -showsdks | grep -i tvos

      - name: Apply official tvOS 27 compatibility patch
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="_Project/Browser"

          PLIST="$PROJECT_DIR/Info.plist"
          HEADER="$PROJECT_DIR/AppDelegate.h"
          SOURCE="$PROJECT_DIR/AppDelegate.m"

          echo "=== Files ==="
          ls -l "$PLIST" "$HEADER" "$SOURCE"

          #
          # ------------------------------------------------------------
          # AppDelegate.h
          # ------------------------------------------------------------
          #

          python3 <<'PY'
          from pathlib import Path

          p = Path("_Project/Browser/AppDelegate.h")
          s = p.read_text()

          old = "@interface AppDelegate : UIResponder <UIApplicationDelegate>"
          new = "@interface AppDelegate : UIResponder <UIApplicationDelegate, UIWindowSceneDelegate>"

          if new not in s:
              if old not in s:
                  raise SystemExit("Could not find AppDelegate interface")

              s = s.replace(old, new, 1)
              p.write_text(s)

          print("AppDelegate.h patched")
          PY

          #
          # ------------------------------------------------------------
          # AppDelegate.m
          # ------------------------------------------------------------
          #

          python3 <<'PY'
          from pathlib import Path

          p = Path("_Project/Browser/AppDelegate.m")
          s = p.read_text()

          if "sceneWillResignActive:(UIScene *)scene" not in s:

              methods = r'''
          #pragma mark - tvOS 26/27 Scene Lifecycle

          - (void)sceneWillResignActive:(UIScene *)scene
          {
              [self saveCookiesToDefaults];
          }

          - (void)sceneDidEnterBackground:(UIScene *)scene
          {
              [self saveCookiesToDefaults];
          }

          - (void)sceneWillEnterForeground:(UIScene *)scene
          {
              [self restoreCookiesFromDefaults];
          }

          - (void)sceneDidBecomeActive:(UIScene *)scene
          {
              [self restoreCookiesFromDefaults];
          }

          '''

              marker = "\n@end"

              if marker not in s:
                  raise SystemExit("Could not find @end in AppDelegate.m")

              s = s.replace(marker, "\n" + methods + "@end", 1)
              p.write_text(s)

          print("AppDelegate.m patched")
          PY

          #
          # ------------------------------------------------------------
          # Info.plist
          # ------------------------------------------------------------
          #

          /usr/libexec/PlistBuddy -c "Delete :UIApplicationSceneManifest" "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :UIApplicationSceneManifest dict" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :UIApplicationSceneManifest:UIApplicationSupportsMultipleScenes bool false" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :UIApplicationSceneManifest:UISceneConfigurations dict" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication array" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0 dict" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneConfigurationName string Default Configuration" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneDelegateClassName string AppDelegate" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneStoryboardFile string Main" \
            "$PLIST"

          echo
          echo "=== AppDelegate.h ==="
          cat "$HEADER"

          echo
          echo "=== Scene methods ==="
          grep -n -A5 -B2 "sceneWillResignActive" "$SOURCE"

          echo
          echo "=== Scene manifest ==="
          /usr/libexec/PlistBuddy \
            -c "Print :UIApplicationSceneManifest" \
            "$PLIST"

      - name: Build
        shell: bash
        run: |
          set -o pipefail

          xcodebuild \
            -project "_Project/Browser.xcodeproj" \
            -scheme "Browser" \
            -configuration Release \
            -sdk appletvos27.0 \
            -destination "generic/platform=tvOS" \
            -derivedDataPath "$PWD/DerivedData" \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build 2>&1 | tee xcodebuild.log

      - name: Show build errors
        if: failure()
        run: |
          echo "=== Compiler errors ==="
          grep -n -E "error:|fatal error:|warning:" xcodebuild.log || true

          echo
          echo "=== Last 150 lines ==="
          tail -150 xcodebuild.log

      - name: Locate application
        id: app
        shell: bash
        run: |
          set -e

          APP=$(find "$PWD/build" \
            -maxdepth 3 \
            -type d \
            -name "*.app" \
            | head -n 1)

          if [ -z "$APP" ]; then
            echo "::error::No .app was produced"
            find "$PWD/build" -maxdepth 4 -print
            exit 1
          fi

          echo "Application: $APP"
          echo "app=$APP" >> "$GITHUB_OUTPUT"

      - name: Create IPA
        run: |
          set -e

          APP="${{ steps.app.outputs.app }}"

          rm -rf ipa
          mkdir -p ipa/Payload

          cp -R "$APP" ipa/Payload/

          cd ipa

          zip -r -q \
            "../tvOSBrowser-tvOS27-unsigned.ipa" \
            Payload

          cd ..

          ls -lh tvOSBrowser-tvOS27-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: tvOSBrowser-tvOS27-unsigned
          path: tvOSBrowser-tvOS27-unsigned.ipa
          retention-days: 30
