name: Build tvOS Browser 27

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned tvOS 27 IPA
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show toolchain
        shell: bash
        run: |
          set -e

          echo "=== Xcode ==="
          xcodebuild -version

          echo
          echo "=== tvOS SDKs ==="
          xcodebuild -showsdks | grep -i tvos || true

      - name: Apply tvOS 27 compatibility patch
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="_Project/Browser"

          PLIST="$PROJECT_DIR/Info.plist"
          HEADER="$PROJECT_DIR/AppDelegate.h"
          SOURCE="$PROJECT_DIR/AppDelegate.m"

          echo "=== Files ==="
          ls -l "$PLIST" "$HEADER" "$SOURCE"

          #
          # ------------------------------------------------------------
          # AppDelegate.h
          # ------------------------------------------------------------
          #

          python3 <<'PY'
          from pathlib import Path

          p = Path("_Project/Browser/AppDelegate.h")
          s = p.read_text()

          old = "@interface AppDelegate : UIResponder <UIApplicationDelegate>"
          new = "@interface AppDelegate : UIResponder <UIApplicationDelegate, UIWindowSceneDelegate>"

          if new in s:
              print("AppDelegate.h already patched")
          elif old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
              print("AppDelegate.h patched")
          else:
              raise SystemExit(
                  "Could not find expected AppDelegate interface"
              )
          PY

          #
          # ------------------------------------------------------------
          # AppDelegate.m
          # ------------------------------------------------------------
          #

          python3 <<'PY'
          from pathlib import Path

          p = Path("_Project/Browser/AppDelegate.m")
          s = p.read_text()

          methods = r'''
          - (void)sceneWillResignActive:(UIScene *)scene
          {
              [self saveCookiesToDefaults];
          }

          - (void)sceneDidEnterBackground:(UIScene *)scene
          {
              [self saveCookiesToDefaults];
          }

          - (void)sceneWillEnterForeground:(UIScene *)scene
          {
              [self restoreCookiesFromDefaults];
          }

          - (void)sceneDidBecomeActive:(UIScene *)scene
          {
              [self restoreCookiesFromDefaults];
          }

          '''

          if "sceneWillResignActive:(UIScene *)scene" in s:
              print("Scene lifecycle methods already present")
              raise SystemExit(0)

          implementation_marker = "@implementation AppDelegate"

          if implementation_marker not in s:
              raise SystemExit(
                  "Could not find @implementation AppDelegate"
              )

          # IMPORTANT:
          # Insert after @implementation AppDelegate, NOT into
          # the private @interface AppDelegate () section.
          insert_position = s.index(implementation_marker)
          insert_position = s.index(
              "\n",
              insert_position
          ) + 1

          s = (
              s[:insert_position]
              + methods
              + s[insert_position:]
          )

          p.write_text(s)

          print("AppDelegate.m patched successfully")
          PY

          #
          # ------------------------------------------------------------
          # Info.plist
          # ------------------------------------------------------------
          #

          echo
          echo "=== Updating Info.plist ==="

          /usr/libexec/PlistBuddy \
            -c "Delete :UIApplicationSceneManifest" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :UIApplicationSceneManifest dict" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :UIApplicationSceneManifest:UIApplicationSupportsMultipleScenes bool false" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :UIApplicationSceneManifest:UISceneConfigurations dict" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication array" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0 dict" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneConfigurationName string Default Configuration" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneDelegateClassName string AppDelegate" \
            "$PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :UIApplicationSceneManifest:UISceneConfigurations:UIWindowSceneSessionRoleApplication:0:UISceneStoryboardFile string Main" \
            "$PLIST"

          echo
          echo "============================================================"
          echo "                  PATCH VERIFICATION"
          echo "============================================================"

          echo
          echo "=== AppDelegate.h ==="
          cat "$HEADER"

          echo
          echo "=== AppDelegate.m ==="
          cat "$SOURCE"

          echo
          echo "=== Scene manifest ==="
          /usr/libexec/PlistBuddy \
            -c "Print :UIApplicationSceneManifest" \
            "$PLIST"

      - name: Build
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "                    STARTING XCODEBUILD"
          echo "============================================================"

          xcodebuild \
            -project "_Project/Browser.xcodeproj" \
            -scheme "Browser" \
            -configuration Release \
            -sdk appletvos27.0 \
            -destination "generic/platform=tvOS" \
            -derivedDataPath "$PWD/DerivedData" \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build 2>&1 | tee xcodebuild.log

          BUILD_RESULT=${PIPESTATUS[0]}

          echo
          echo "============================================================"
          echo "                 XCODEBUILD DIAGNOSTICS"
          echo "============================================================"

          echo
          echo "=== All compiler errors ==="

          grep -n -B3 -A8 \
            -E "error:|fatal error:" \
            xcodebuild.log || true

          echo
          echo "=== AppDelegate diagnostics ==="

          grep -n -B5 -A10 \
            "AppDelegate.m" \
            xcodebuild.log | \
            grep -E \
            "error:|warning:|AppDelegate.m" \
            || true

          echo
          echo "=== Last 200 lines of build log ==="

          tail -200 xcodebuild.log

          echo
          echo "============================================================"
          echo "                 BUILD RESULT: $BUILD_RESULT"
          echo "============================================================"

          exit "$BUILD_RESULT"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Locate application
        id: app
        shell: bash
        run: |
          set -e

          echo "=== Searching for .app ==="

          APP=$(find "$PWD/build" \
            -maxdepth 3 \
            -type d \
            -name "*.app" \
            | head -n 1)

          if [ -z "$APP" ]; then
            echo "::error::No .app was produced"

            echo
            echo "=== Build directory ==="

            find "$PWD/build" \
              -maxdepth 5 \
              -print || true

            exit 1
          fi

          echo
          echo "Application found:"
          echo "$APP"

          echo "app=$APP" >> "$GITHUB_OUTPUT"

      - name: Verify application
        shell: bash
        run: |
          set -e

          APP="${{ steps.app.outputs.app }}"

          echo "=== Application ==="
          echo "$APP"

          echo
          echo "=== Bundle identifier ==="

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP/Info.plist"

          echo
          echo "=== Bundle version ==="

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$APP/Info.plist" \
            2>/dev/null || true

          echo
          echo "=== Bundle version number ==="

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$APP/Info.plist" \
            2>/dev/null || true

          echo
          echo "=== Code signature ==="

          codesign -dv "$APP" 2>&1 || true

          echo
          echo "=== App contents ==="

          find "$APP" \
            -maxdepth 2 \
            -type f \
            | head -100

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -e

          APP="${{ steps.app.outputs.app }}"

          echo "Creating unsigned IPA..."

          rm -rf ipa
          mkdir -p ipa/Payload

          cp -R "$APP" ipa/Payload/

          cd ipa

          zip -r \
            -q \
            "../tvOSBrowser-tvOS27-unsigned.ipa" \
            Payload

          cd ..

          echo
          echo "=== IPA created ==="

          ls -lh \
            tvOSBrowser-tvOS27-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: tvOSBrowser-tvOS27-unsigned
          path: tvOSBrowser-tvOS27-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
